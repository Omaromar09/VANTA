<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,15 90,85 10,85' fill='%23F36B21'/><polygon points='50,35 75,78 25,78' fill='%23050608'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>VANTA — Drive Beyond Ordinary | Luxury Automotive Digital Experience</title>
    <meta name="description" content="VANTA Automotive by 7P STUDIO. Experience our hypercar collection, real-time 3D configurator, bespoke styling, ceramic protection, and track performance engineering." />
    <meta name="keywords" content="VANTA, hypercar, 3D car configurator, luxury automotive, ceramic coating, paint protection, 7P STUDIO" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="VANTA — Drive Beyond Ordinary" />
    <meta property="og:description" content="Experience the ultimate luxury hypercar showcase and real-time 3D configurator." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/hero-car-final-frame.jpg" />

    <!-- Premium Fonts: Barlow Condensed & Inter (EN) + Cairo, Readex Pro, IBM Plex Sans Arabic, Tajawal (AR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Readex+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Critical Intro & RTL Pre-hydration Script -->
    <script>
      (function() {
        var p = new URLSearchParams(window.location.search);
        if (p.has('nointro') || p.has('skip') || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('intro-done');
        }
        var l = p.get('lang') || localStorage.getItem('vanta_language');
        if (l === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        } else if (l === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
        var sc = p.get('scroll');
        if (sc) {
          window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
              var el = document.getElementById(sc);
              if (el) el.scrollIntoView({ behavior: 'instant' });
            }, 600);
          });
        }
      })();
    </script>
    <style>
      :root { --bg:#050505; --accent:#ff6a1a; }
      html, body, #root { width:100%; min-height:100dvh; margin:0; padding:0; background:var(--bg); color:#fff; overflow-x:clip; }
      #intro { position:fixed; inset:0; z-index:9999; background:#000; transition:opacity .7s ease; }
      #intro video { position:absolute; inset:0; width:100%; height:100%; height:100dvh; object-fit:cover; }
      #intro.fade { opacity:0; pointer-events:none; }
      #skip { position:absolute; right:20px; bottom:20px; padding:10px 18px; border:1px solid #fff5;
              background:#0006; color:#fff; border-radius:999px; cursor:pointer; font:inherit; font-size:12px; }
      #skip:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
      #site { visibility:hidden; opacity:0; pointer-events:none; width:100%; min-height:100dvh; }
      html.intro-done #site { visibility:visible; opacity:1; pointer-events:auto; transition:opacity .8s ease; }
      html:not(.intro-done) { overflow:hidden !important; }
    </style>
  </head>
  <body class="bg-[#050608] text-[#F3F3F1] selection:bg-[#F36B21] selection:text-white antialiased overflow-x-clip min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
